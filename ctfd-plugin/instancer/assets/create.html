{% extends "admin/challenges/create.html" %}

{% block header %}
<div class="alert alert-secondary" role="alert">
	Instancer challenges spin up a per-user Docker container on demand. Each user gets a
	unique dynamic flag and instances are capped per user.
</div>
{% endblock %}

{% block value %}
<div class="form-group">
	<label>Value<br>
		<small class="form-text text-muted">Points awarded for solving.</small>
	</label>
	<input type="number" class="form-control" name="value" placeholder="Enter value" required>
</div>

<div class="form-group">
	<label>Docker Image<br>
		<small class="form-text text-muted">Image tag to run, e.g. <code>chal-web-sample:latest</code>.</small>
	</label>
	<input type="text" class="form-control" name="docker_image" placeholder="repo/image:tag" required>
</div>

<div class="form-group">
	<label>Kind<br>
		<small class="form-text text-muted">web = HTTP service; tcp = nc-style, served as an in-browser terminal (ttyd).</small>
	</label>
	<select name="kind" class="custom-select">
		<option value="web">web</option>
		<option value="tcp">tcp (nc / ttyd)</option>
	</select>
</div>

<div class="form-group">
	<label>Container Port<br>
		<small class="form-text text-muted">Port the service listens on inside the container.</small>
	</label>
	<input type="number" class="form-control" name="port" value="8000" required>
</div>

<div class="form-group">
	<label>TTL (minutes)</label>
	<input type="number" class="form-control" name="ttl_minutes" value="30" required>
</div>

<div class="form-group">
	<label>Per-user instance limit</label>
	<input type="number" class="form-control" name="per_user_limit" value="1" required>
</div>

<div class="form-group">
	<label>Memory (MB)</label>
	<input type="number" class="form-control" name="mem_mb" value="256" required>
</div>

<div class="form-group">
	<label>CPUs</label>
	<input type="text" class="form-control" name="cpus" value="0.5" required>
</div>

<div class="form-group">
	<label>Flag prefix<br>
		<small class="form-text text-muted">Dynamic flag is <code>prefix{...}</code>, unique per user.</small>
	</label>
	<input type="text" class="form-control" name="flag_prefix" value="flag" required>
</div>
{% endblock %}

{% block type %}
<input type="hidden" value="instancer" name="type" id="chaltype">
{% endblock %}
